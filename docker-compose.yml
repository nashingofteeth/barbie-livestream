version: "3.8"

services:
  owncast:
    image: owncast/owncast:latest
    container_name: barbie-owncast
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web interface
      - "1935:1935"   # RTMP streaming port
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/New_York
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
